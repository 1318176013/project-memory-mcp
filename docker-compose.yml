# Local/remote PostgreSQL (with pgvector) dependency for project-memory-mcp.
# The MCP server does not start or manage this service; run this file manually:
#
#   docker compose up -d postgres
#
# The image is pgvector/pgvector (PostgreSQL 18 + the `vector` extension); the
# migrations run `CREATE EXTENSION IF NOT EXISTS vector` on first migrate.
#
# Network exposure is controlled by PG_BIND_IP (see .env / .env.example):
#   - Defaults to 127.0.0.1 so a bare `docker compose up` never exposes Postgres
#     to the public internet.
#   - For the remote-DB / local-MCP topology, set PG_BIND_IP to the server's
#     ZeroTier IP so Postgres is reachable only inside the ZeroTier virtual LAN,
#     never on the public interface.
#
# Memory is tuned for a small (e.g. 1 vCPU / 2 GB) host: a hard limit plus
# conservative shared_buffers/work_mem so Postgres cannot starve the box.
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_memory}
      POSTGRES_USER: ${POSTGRES_USER:-project_memory}
      # No default: must be supplied via .env so the weak placeholder password
      # never ships as a usable credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=50"
    ports:
      # Bind only to PG_BIND_IP (ZeroTier IP in production); never 0.0.0.0.
      - "${PG_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      # PG18+ images store data under a version-specific subdir and want the
      # volume mounted at /var/lib/postgresql (not .../data); mounting the old
      # .../data path trips the image's startup self-check and crash-loops.
      - project-memory-postgres:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project_memory} -d ${POSTGRES_DB:-project_memory}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  project-memory-postgres:
